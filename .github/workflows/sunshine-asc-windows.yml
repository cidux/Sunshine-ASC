name: Sunshine-ASC Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'asc-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-libtiff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add Node.js to MSYS2 PATH
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source -Parent
          echo "NODEJS_PATH=$nodeDir" >> $env:GITHUB_ENV
          echo "$nodeDir" >> $env:GITHUB_PATH

      - name: Configure
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          export PATH="$PATH:$(cygpath "$NODEJS_PATH")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WERROR=OFF \
            -DCMAKE_INSTALL_PREFIX="C:/Sunshine-ASC"

      - name: Build
        run: ninja -C build

      - name: Package NSIS installer
        run: |
          cd build
          cpack -G NSIS
          mkdir -p ../artifacts
          cp cpack_artifacts/Sunshine-ASC-Windows-x64-Setup.exe ../artifacts/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-ASC-Windows-x64
          path: artifacts/Sunshine-ASC-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/asc-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/Sunshine-ASC-Windows-x64-Setup.exe" `
            --title "Sunshine-ASC ${{ github.ref_name }}" `
            --notes "Windows x64 installer with automatic monitor switching." `
            --prerelease
